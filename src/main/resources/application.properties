spring.application.name=eventpass-utec

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventpass}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:eventpass-utec-dev-secret-key-256-bits-minimum-required}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
