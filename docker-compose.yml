services:
  postgres:
    image: postgres:16-alpine
    container_name: week05-lab01-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: week05-lab01
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d week05-lab01"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: pc1-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST={DB_HOST}
      - DB_PORT={DB_PORT}
      - DB_NAME={DB_NAME}
      - DB_USER={DB_USER}
      - DB_PASSWORD={DB_PASSWORD}